<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Checkout fixture</title>
<link rel="stylesheet" href="/assets/css/bootstrap.min.css"><link rel="stylesheet" href="/assets/css/ace.min.css"><link rel="stylesheet" href="/assets/font-awesome/4.5.0/css/font-awesome.min.css">
<!--MM-HEAD--><link rel="stylesheet" href="/assets/css/chosen.min.css"><link rel="stylesheet" href="/assets/css/bootstrap-datepicker3.min.css"><link rel="stylesheet" href="/assets/css/chosen.min.css" />
<!--/MM-HEAD--><link rel="stylesheet" href="/assets/custom_css/style.css"><link rel="stylesheet" href="/assets/custom_css/ui.css"><link rel="stylesheet" href="/assets/custom_css/shell.css"></head><body class="no-skin mm-shell"><div class="mm-shell-main" style="padding:16px"><!--MM-BODY--><section class="mm-ui mm-hotel-setup">
    <div class="tw-space-y-4 tw-py-2">
        <header class="mm-page-head tw-flex tw-flex-wrap tw-items-center tw-justify-between tw-gap-x-4 tw-gap-y-2">
            <div class="mm-page-title">
                <h1 class="tw-m-0 tw-font-semibold tw-text-ink">Add amenity</h1>
                <p class="tw-m-0 tw-text-sm tw-text-muted">Name, icon (38 x 40 px) and status.</p>            </div>
            <div class="tw-flex tw-flex-wrap tw-gap-2 mm-no-print"><a class="mm-button mm-button-secondary" href="http://localhost/hotel/aminities"><i class="fa fa-list-alt"></i> Amenities list</a></div>        </header>
        <div class="mm-panel tw-p-4 sm:tw-p-6"><form class="form-horizontal" id="companyForm" action="http://localhost/hotel/aminities" method="post" enctype="multipart/form-data">
            <input type="hidden" name="_token" value="fixture-csrf-token">

            <div class="row">
                <div class="col-sm-12">
                    <div class="form-group">
                        <label class="col-sm-3 control-label" for="form-field-1-1">Aminities Name</label>

                        <div class="col-xs-12 col-sm-8 ">
                            <input type="text" class="form-control input-sm" name="name" value="" placeholder="Aminities Name">

                                                    </div>
                    </div>
                </div>
                <div class="col-sm-12">
                    <div class="form-group">
                        <label class="col-sm-3 control-label" for="form-field-1-1">Aminities icon</label>

                        <div class="col-xs-12 col-sm-8 ">
                            <label class="text-danger">use flaticon icon/png size (38 * 40)px</label>
                            <input type="file" name="aminiti_icon" class="category_photos" multiple>

                                                    </div>
                    </div>
                </div>
                <div class="col-sm-12">
                    <div class="form-group">
                        <label class="col-sm-3 control-label" for="form-field-1-1"> Status</label>

                        <div class="col-xs-12 col-sm-8 ">
                            <select name="status">
                                <option value="">Select Option</option>
                                <option value="1">Active</option>
                                <option value="0">In Active</option>
                            </select>
                                                    </div>
                    </div>
                </div>
            </div>


            <div class="form-actions center" style="text-align: right !important;">
                <button type="submit" class="mm-button">
                    <i class="ace-icon fa fa-save icon-on-right bigger-110"></i>
                    Save
                </button>
            </div>
        </form></div>
    </div>
</section>
<!--/MM-BODY--></div>

<!-- inline scripts related to this page -->
<script type="text/javascript">
    function delete_check(id) {
        Swal.fire({
            title: 'Are you sure ?',
            html: "<b>You want to delete permanently !</b>",
            type: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#3085d6',
            cancelButtonColor: '#d33',
            confirmButtonText: 'Yes, delete it!',
            width: 400,
        }).then((result) => {
            if (result.value) {
                $('#deleteCheck_' + id).submit();
            }
        })

    }
</script>

  <!--Drag and drop-->
<script type="text/javascript">
    jQuery(function($) {
        $('.category_photos').ace_file_input({
            style: 'well',
            btn_choose: 'Upload Aminities Icon',
            btn_change: null,
            no_icon: 'ace-icon fa fa-cloud-upload',
            droppable: true,
            thumbnail: 'small' //large | fit

        }).on('change', function() {
        });
    });
</script>
