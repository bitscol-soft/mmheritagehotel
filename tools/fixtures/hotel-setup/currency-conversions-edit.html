<div class="mm-panel tw-p-4 sm:tw-p-6 mm-hotel-setup-fragment"><div class="mm-setup-panel-head">
            <h2 class="mm-setup-title"><i class="fa fa-edit"></i> Edit</h2>
            <a href="#" onclick="render(`http://localhost/hotel/currency-conversions/create`)" class="render-view">
                <i class="fa fa-plus-circle"></i> Currency Conversions Create
            </a>
        </div>
                <form class="form-horizontal" id="companyForm" action="http://localhost/hotel/currency-conversions/3"
        method="post">
        <input type="hidden" name="_token" value="fixture-csrf-token">        <input type="hidden" name="_method" value="PUT">
        <div class="row">
            <div class="col-sm-12 mt-2">
                <div class="form-group">
                    <label class="col-sm-3 control-label" for="form-field-1-1"> Currency <span style="color: deeppink">*</span> </label>

                    <div class="col-xs-12 col-sm-8 ">

                        <select name="currency_id" id="currencyId" class="form-control chosen-select" required><option value="">Select Currency</option><option value="1">BDT</option><option value="2" selected>USD</option></select>

                                            </div>
                </div>
            </div>

            <div class="col-sm-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label" for="form-field-1-1"> Rate <span style="color: deeppink">*</span></label>

                    <div class="col-xs-12 col-sm-8 ">
                        <input type="text" class="form-control input-sm" name="rate"
                            value="122.5" placeholder="Enter Rate" required>

                                            </div>
                </div>
            </div>

            <div class="col-sm-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label" for="form-field-1-1"> Date </label>
                    <div class="col-xs-12 col-sm-8 ">
                        <input type="text" class="form-control input-sm date-picker" name="effected_date" id="effectedDate"
                            value="2026-09-01" placeholder="Enter Effected Date">

                                            </div>
                </div>
            </div>


        </div>


        <div class="form-actions center" style="text-align: right !important;">
            <button type="submit" class="mm-button" id="submitRoomFormBtn" onclick="submitRoomStoreForm(this)">
                <i class="ace-icon fa fa-save icon-on-right bigger-110"></i>
                Update
            </button>
        </div>
    </form></div>
