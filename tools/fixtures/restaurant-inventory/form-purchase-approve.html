    <script>
        var item_row = 0;
        var items = [];

        function load_item_stock(element) {
            var id = $(element).val();
            var count = 0;
            $.each($('.item'), function(el) {
                if (id == $(this).val()) {
                    count++;
                }
                if (count > 1) {
                    alert('This item already selected')
                    $(this).val('')
                }
            });

            if (count <= 1) {
                var row = $(element).closest('tr');

                $.ajax({
                    url: 'http://localhost/generalstore/ajax/item/get-item-details/purchase',
                    type: 'GET',
                    data: 'id=' + id,
                    success: function(res) {
                        row.find('.item_unit').val(res['item_unit']);
                        row.find('.current_stock').val(res['current_stock']);

                        // console.log(res['last_purchase'])
                        if (res['last_purchases'] != "") {
                            var url = "/gs/purchases/" + res['last_purchase'].id;
                            row.find('.last_purchase').html('<a target="_blank" href="' + url + '">' + res[
                                'last_purchase'].form_number + '</a>');
                            row.find('.last_purchase_input').val('<a target="_blank" href="' + url + '">' + res[
                                'last_purchase'].form_number + '</a>');
                        } else {
                            row.find('.last_purchase').html('');
                            row.find('.last_purchase_input').val('');
                        }
                    }
                });
            }
        }

        function insert_Row(el) {
            // alert($(".company_id option:selected").val())
            var item_row = $('.item').length + 1;
            // first delete add item
            $(el).parents("tr").remove();

            // add new item row
            var r = document.getElementById('purchase_table').insertRow();

            var c1 = r.insertCell(0);
            var c2 = r.insertCell(1);
            var c3 = r.insertCell(2);
            var c4 = r.insertCell(3);
            var c5 = r.insertCell(4);
            var c6 = r.insertCell(5);

            // populate product

            c1.innerHTML = '<select name="item_id[]" class="form-control item item' + item_row +
                ' chosen-select" onchange="load_item_stock(this)"></select>';

            c2.innerHTML = '<input type="text" name="item_unit_id[]" class="form-control item_unit" readonly="readonly" />';

            c3.innerHTML = '<input type="text" id="item_available_quantityq"' + item_row +
                ' name="item_available_quantity[]" class="form-control current_stock" readonly="readonly" />';

            c4.innerHTML =
                '<input onkeypress="return event.charCode == 46 || event.charCode >= 48 && event.charCode <= 57" type="text" id="q"' +
                item_row + ' name="quantity[]" class="form-control quantity" />';
            c5.innerHTML = '<span class="last_purchase">' +
                '<input type="hidden" value="" name="last_purchases[]" class="form-control last_purchase" />';

            c6.innerHTML =
                '<button type="button" class="ibtnDel btn btn-sm btn-danger delete_row" onclick="removeRow(this)"><i class="fa fa-times-circle"></i></button>';

            // again add "+ Add New" Button
            var markup =
                '<tr><td colspan="7" style="text-align: right;"><button type="button" onclick="insert_Row(this)" class="btn btn-xs btn-inverse add_row r-btnAdd"> + Add New </button></td></tr>';
            $("table tbody").append(markup);

            var company_id = $(".company_id option:selected").val();
            load_items(null, company_id, item_row);
            chosenTrigger()
        }

        // delete specifiv row
        function removeRow(el) {
            var item_row = $('#purchase_table tr').length;
            if (item_row > 4) {
                $(el).parents("tr").remove();
            }

        }

        function load_items(element = null, company_id = null, item_row = null) {
            var id = company_id == null ? $(element).val() : company_id;
            var row = $(element).closest('tr');

            $.ajax({
                url: 'http://localhost/generalstore/ajax/items/get-item-list',
                type: 'GET',
                data: 'id=' + id,
                success: function(res) {
                    if (item_row != null) {
                        $('.item' + item_row).append('<option value="">select</option>');
                        $.each(res['items'], function(id, name) {
                            $('.item' + item_row).append('<option value="' + id + '">' + name +
                                '</option>').trigger('chosen:updated');
                        });
                    } else {
                        $('.item').empty()
                        $('.item').append('<option value="">select</option>');
                        $.each(res['items'], function(id, name) {
                            $('.item').append('<option value="' + id + '">' + name + '</option>')
                                .trigger('chosen:updated');
                        });
                    }
                    items = res['items'];
                }
            });
        }
    </script>

    <script type="text/javascript">
        $(() => chosenTrigger())

        function chosenTrigger() {
            jQuery(function($) {

                if (!ace.vars['touch']) {
                    $('#company_id').chosen({
                        allow_single_deselect: true
                    });
                    //resize the chosen on window resize

                    $(window)
                        .off('resize.chosen')
                        .on('resize.chosen', function() {
                            $('#company_id').each(function() {
                                var $this = $(this);
                                $this.next().css({
                                    'width': $this.parent().width()
                                });
                            })
                        }).trigger('resize.chosen');
                    //resize chosen on sidebar collapse/expand
                    $(document).on('settings.ace.chosen', function(e, event_name, event_val) {
                        if (event_name != 'sidebar_collapsed') return;
                        $('#company_id').each(function() {
                            var $this = $(this);
                            $this.next().css({
                                'width': $this.parent().width()
                            });
                        })
                    });

                    $('#chosen-multiple-style .btn').on('click', function(e) {
                        var target = $(this).find('input[type=radio]');
                        var which = parseInt(target.val());
                        if (which == 2) $('#form-field-select-4').addClass('tag-input-style');
                        else $('#form-field-select-4').removeClass('tag-input-style');
                    });
                }

                if (!ace.vars['touch']) {
                    $('.chosen-select').chosen({
                        allow_single_deselect: true
                    });
                    //resize the chosen on window resize

                    $(window)
                        .off('resize.chosen')
                        .on('resize.chosen', function() {
                            $('.chosen-select').each(function() {
                                var $this = $(this);
                                $this.next().css({
                                    'width': $this.parent().width()
                                });
                            })
                        }).trigger('resize.chosen');
                    //resize chosen on sidebar collapse/expand
                    $(document).on('settings.ace.chosen', function(e, event_name, event_val) {
                        if (event_name != 'sidebar_collapsed') return;
                        $('.chosen-select').each(function() {
                            var $this = $(this);
                            $this.next().css({
                                'width': $this.parent().width()
                            });
                        })
                    });
                }

            })
        }
    </script>
