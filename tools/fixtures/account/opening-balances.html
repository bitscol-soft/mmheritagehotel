<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Checkout fixture</title>

<!--MM-HEAD--><link rel="stylesheet" href="/assets/css/chosen.min.css"><link rel="stylesheet" href="/assets/css/bootstrap-datepicker3.min.css">    <link rel="stylesheet" href="/assets/css/chosen.min.css"/>
    <link rel="stylesheet" href="/assets/css/bootstrap-datepicker3.min.css"/>
<!--/MM-HEAD--><link rel="stylesheet" href="/assets/custom_css/style.css"><link rel="stylesheet" href="/assets/custom_css/ui.css"><link rel="stylesheet" href="/assets/custom_css/shell.css"></head><body class="no-skin mm-shell"><div class="mm-shell-main" style="padding:16px"><!--MM-BODY-->
<section class="mm-ui mm-report mm-acc mm-rst mm-rst-inv mm-rst-form">
    <div class="tw-space-y-4 tw-py-2">
        <header class="mm-page-head tw-flex tw-flex-wrap tw-items-center tw-justify-between tw-gap-x-4 tw-gap-y-2">
            <div class="mm-page-title">
                <h1 class="tw-m-0 tw-font-semibold tw-text-ink">Account Opening Balance</h1>
                <p class="tw-m-0 tw-text-sm tw-text-muted">Enter opening balances for the ledger accounts.</p>            </div>
            <div class="tw-flex tw-flex-wrap tw-gap-2 mm-no-print"><a class="mm-button mm-button-secondary" href="http://localhost/acc/account-opening-balances/create"><i class="fa fa-refresh"></i> Refresh</a>
                    <a class="mm-button" href="http://localhost/acc/accounts/create"><i class="fa fa-plus"></i> Add New</a></div>        </header>
        <div class="mm-panel tw-p-4 sm:tw-p-6 mm-report-filter"><form action="" method="GET" class="mm-setup-filter mm-report-form">
                <div class="input-group">
                    <label class="input-group-addon">Company <strong class="text-danger">*</strong></label>
                    <select class="form-control chosen-select-100-percent required" required name="company_id">
                        <option></option>
                                                    <option value="1" >MM &lt;b&gt;Heritage&lt;/b&gt;</option>
                         
                    </select>
                </div>

                <div class="input-group">
                    <label class="input-group-addon">Account Group</label>
                    <select class="form-control chosen-select-100-percent" id="account_group_id" name="account_group_id">
                        <option></option>
                                                    <option value="0" selected></option>
                                                    <option value="1" ></option>
                         
                    </select>
                </div>

                <div class="input-group">
                    <label class="input-group-addon">Account Control</label>
                    <select class="form-control chosen-select-100-percent" id="account_control_id" name="account_control_id">
                        <option></option>
                                                    <option value="1" >Current</option>
                         
                    </select>
                </div>

                <div class="btn-group">
                    <button type="submit" class="mm-button"><i class="fa fa-check-circle"></i> Get Data</button>
                </div>
            </form></div>
    <div class="mm-panel tw-p-4 sm:tw-p-6 tw-p-4"><!-- LIST -->
        <div class="row" style="width: 100%; margin: 0 !important;">

            
        </div></div>
    </div>
</section>

<!--/MM-BODY--></div>
<script src="/assets/js/jquery-2.1.4.min.js"></script><script src="/assets/js/bootstrap.min.js"></script><script src="/assets/js/ace-elements.min.js"></script><script src="/assets/js/ace.min.js"></script>
<!--MM-JS--><script src="/assets/js/chosen.jquery.min.js"></script><script src="/assets/js/bootstrap-datepicker.min.js"></script><script src="/assets/js/bootstrap-timepicker.min.js"></script><script src="/assets/custom_js/date-picker.js"></script>
<script>window.warnings = []; function warning(kind, message) { window.warnings.push(message); } jQuery.LoadingOverlay = function (action) { window.overlay = (window.overlay || []).concat(action); };</script>
    <script src="/assets/js/chosen.jquery.min.js"></script>
    <script src="/assets/custom_js/chosen-box.js"></script>


    <script>
        $(document).ready(function () {
            const accountControlId = $('#account_control_id');
            const accountSubsidiaryId = $('#account_subsidiary_id');

            $('#account_group_id').change(function () {
                $.get(`http://localhost/acc/ajax/account-controls?account_group_id=${$(this).val()}`, function (res) {
                    accountControlId.empty().append('<option></option>')

                    res.forEach(function (item) {
                        accountControlId.append(`<option value="${item.id}">${item.name}</option>`)
                    })

                    accountControlId.trigger('chosen:updated');
                    accountControlId.trigger('change')
                })
            })

            $('#account_control_id').change(function () {
                $.get(`http://localhost/acc/ajax/account-subsidiaries?account_control_id=${$(this).val()}`, function (res) {
                    accountSubsidiaryId.empty().append('<option></option>')

                    res.forEach(function (item) {
                        accountSubsidiaryId.append(`<option value="${item.id}">${item.name}</option>`)
                    })

                    accountSubsidiaryId.trigger('chosen:updated');
                })
            })
        });
    </script>

<!--/MM-JS--></body></html>
