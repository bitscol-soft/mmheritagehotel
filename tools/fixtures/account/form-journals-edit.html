<script>
    const saveButton = $('.save-btn')
    const inputDebit = $('.input-debit')
    const inputCredit = $('.input-credit')

    const rowItem = `<tr>
                        <td class="count"></td>
                        <td>
                            <div class="col-sm-12">
                                <select id="account_id" name="account_ids[]" value="" class="chosen-select-100-percent" data-placeholder="- Select Account -">
                                    <option value=""></option>
                                                                        <option value="1" data-balance="0" >Cash &lt;b&gt;in hand&lt;/b&gt;</option>
                                                                        <option value="2" data-balance="0" >Bank</option>
                                                                    </select>
                                                            </div>
                        </td>
                        <td>
                            <input name="debit[]" value="" type="text" onkeypress="return onlyNumber(event)" onclick="enableMe(this)" onkeyup="disabledReverse('input-credit', this)" class="form-control text-right calculate-total input-debit input-sm" />
                                                    </td>
                        <td>
                            <input name="credit[]" value="" type="text" onkeypress="return onlyNumber(event)" onclick="enableMe(this)" onkeyup="disabledReverse('input-debit', this)" class="form-control text-right input-credit calculate-total input-sm" />
                                                    </td>
                        <td><a class="ibtnDel btn btn-sm btn-danger"><i class="fa fa-trash-o"></i></a></td>
                    </tr>`

    jQuery(function($) {
        $('#id-input-file-3').ace_file_input({
            style: 'well',
            btn_choose: 'Drop files here or click to choose',
            btn_change: null,
            no_icon: 'ace-icon fa fa-cloud-upload',
            droppable: true,
            thumbnail: 'small' //large | fit

        }).on('change', function() {
            //console.log($(this).data('ace_input_files'));
            //console.log($(this).data('ace_input_method'));
        });

        // Start header, footer
        $('#header').ace_file_input({
            style: 'well',
            btn_choose: 'Drop files here or click to choose',
            btn_change: null,
            no_icon: 'ace-icon fa fa-cloud-upload',
            droppable: true,
            thumbnail: 'small' //large | fit
        });
        $('#footer').ace_file_input({
            style: 'well',
            btn_choose: 'Drop files here or click to choose',
            btn_change: null,
            no_icon: 'ace-icon fa fa-cloud-upload',
            droppable: true,
            thumbnail: 'small' //large | fit
        });
        // End header, footer
    });

    $(document).ready(function() {
        calculateAmount()
        saveButton.attr('disabled', false)
    });

    $(document).on("keyup", ".calculate-total", function() {
        calculateAmount()
    });

    function calculateAmount() {
        var debitTotal = 0;
        $(".input-debit").each(function() {
            debitTotal += Number($(this).val());
        });

        var creditTotal = 0;
        $(".input-credit").each(function() {
            creditTotal += Number($(this).val());
        });

        $(".total-debit").val(debitTotal);
        $(".total-credit").val(creditTotal);

        if (debitTotal === creditTotal && debitTotal > 0) {
            saveButton.attr('disabled', false)
        }else{
            saveButton.attr('disabled', true)
        }
    }

    function disabledReverse($class_name, object) {
        let disableItem = $(object).closest('tr').find('.' + $class_name)
        disableItem.attr('readonly', true).val('0')
    }

    function enableMe(object) {
        $(object).attr('readonly', false)
    }
</script>


<script type="text/javascript">
    $(document).ready(function() {
        var i = 0;
        $("#addrow").on("click", function() {
            $("table.order-list").append(rowItem)
            chosenSelectInit()
            i++;
        });

        $("table.order-list").on("click", ".ibtnDel", function(event) {
            $(this).closest("tr").remove();
            i -= 1
            calculateAmount()
        });
    });
</script>
