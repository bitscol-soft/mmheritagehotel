    <div class="tw-space-y-4 tw-py-2">
        <header class="mm-page-head tw-flex tw-flex-wrap tw-items-center tw-justify-between tw-gap-x-4 tw-gap-y-2">
            <div class="mm-page-title">
                <h1 class="tw-m-0 tw-font-semibold tw-text-ink">Add a hall category</h1>
                <p class="tw-m-0 tw-text-sm tw-text-muted">Define the hall type, capacity, rates, amenities and photos.</p>            </div>
            <div class="tw-flex tw-flex-wrap tw-gap-2 mm-no-print"><a href="http://localhost/bq/banquet/hall-categories/index" class="mm-button mm-button-secondary">
                    <i class="fa fa-list-alt" aria-hidden="true"></i> Category List
                </a></div>        </header>
        <div class="mm-panel tw-p-4 sm:tw-p-6 tw-p-5"><form class="form-horizontal" action="http://localhost/bq/banquet/hall-categories/store" method="post"
                enctype="multipart/form-data">
                <input type="hidden" name="_token" value="fixture-csrf-token">
                


                <div class="row">
                    <div class="col-md-6">
                        <div class="row">
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label class="col-sm-3 control-label" for="cat_name"> Name <sup
                                            class="text-danger">*</sup> </label>
                                    <div class="col-xs-12 col-sm-8 ">
                                        <input type="text" id="cat_name" name="cat_name"
                                            placeholder="Enter Category Name" class="form-control" required>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label class="col-sm-3 control-label" for="capacity"> Guest Capacity <sup
                                            class="text-danger">*</sup></label>
                                    <div class="col-xs-12 col-sm-8 ">
                                        <input type="number" id="capacity" name="guest_capacity"
                                            placeholder="Enter Guest Capacity" class="form-control" required>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label class="col-sm-3 control-label">Description</label>
                                    <div class="col-xs-12 col-sm-8 ">
                                        <textarea name="description" rows="5" class="form-control" placeholder="Enter Description"></textarea>

                                                                            </div>
                                </div>
                            </div>



                            
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="row">
                            
                            
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label class="col-sm-3 control-label" for="price">Aminities <sup
                                            class="text-danger">*</sup></label>
                                    <div class="col-xs-12 col-sm-8 ">
                                        <div class="checkbox">
                                                                                            <label>
                                                    <input name="aminities[]" value="1"
                                                        type="checkbox" class="ace">
                                                    <span class="lbl">&nbsp;Stage &lt;b&gt;lights&lt;/b&gt;</span>
                                                </label>
                                                                                            <label>
                                                    <input name="aminities[]" value="2"
                                                        type="checkbox" class="ace">
                                                    <span class="lbl">&nbsp;Sound</span>
                                                </label>
                                                                                    </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-12">
                            <div class="form-group">
                                <label class="col-sm-3 control-label">Status <sup
                                        class="text-danger">*</sup></label>

                                <div class="col-xs-12 col-sm-8 ">
                                    <select name="status" class="chosen-select form-control" required>
                                        <option></option>
                                        <option value="1" selected>Active</option>
                                        <option value="0">In Active</option>
                                    </select>

                                                                    </div>
                            </div>
                        </div>
                        
                    </div>
                </div>


                <div class="col-md-12 guest-wise-price-div" style="display: none">
                    <div class="form-group">
                        <h4 style="font-weight: bolder">Guest Wise Price</h4>
                        <hr style="border:2px dotted rgb(182, 214, 182)">
                        <div class="col-xs-12 price-entry">

                        </div>
                    </div>
                </div>



                <div class="form-group">
                    <div class="col-xs-12 col-sm-12 text-right">
                        <div class="btn-group">
                            <button class="mm-button" type="submit"> <i
                                    class="fa fa-save"></i> Save</button>
                            <button class="mm-button mm-button-secondary" type="Reset"> <i
                                    class="fa fa-refresh"></i> Reset</button>
                        </div>
                    </div>
                </div>
            </form></div>
    </div>
</section>
