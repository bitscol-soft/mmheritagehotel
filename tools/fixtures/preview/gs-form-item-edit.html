<script type="text/javascript">

    jQuery(function($){

        if(!ace.vars['touch']) {
            $('.chosen-select').chosen({allow_single_deselect:true});
            //resize the chosen on window resize

            $(window)
                .off('resize.chosen')
                .on('resize.chosen', function() {
                    $('.chosen-select').each(function() {
                        var $this = $(this);
                        $this.next().css({'width': $this.parent().width()});
                    })
                }).trigger('resize.chosen');
            //resize chosen on sidebar collapse/expand
            $(document).on('settings.ace.chosen', function(e, event_name, event_val) {
                if(event_name != 'sidebar_collapsed') return;
                $('.chosen-select').each(function() {
                    var $this = $(this);
                    $this.next().css({'width': $this.parent().width()});
                })
            });
        }

    })
</script>


<script type="text/javascript">

    
    // validation numeric input
    $(document).ready(function() {
        $(".opening_balance").bind("keypress", function (e) {
            var keyCode = e.which ? e.which : e.keyCode
                
            if (!(keyCode >= 48 && keyCode <= 57)) {
                return false;
            } 
            if (this.value.length == 0 && e.which == 48 ){
                return false;
            }
        });
    });


    function load_units(element){
        var id = $(element).val();

        $.ajax({
            url: 'http://localhost/ajax/items/get_units',
            type: 'GET',
            data: 'id='+id,
            success:function(res){
                    $('#item_unit_id').empty();
                $.each(res['item_units'], function(id, name){
                    $('#item_unit_id').val('').trigger('chosen:updated');

                    $('#item_unit_id').append('<option value="'+id+'">'+name+'</option>')
                });
            }
        });
    }

</script>
