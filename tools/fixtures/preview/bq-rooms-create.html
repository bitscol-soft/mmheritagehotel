<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Checkout fixture</title>
<link rel="stylesheet" href="/assets/css/bootstrap.min.css"><link rel="stylesheet" href="/assets/css/ace.min.css"><link rel="stylesheet" href="/assets/font-awesome/4.5.0/css/font-awesome.min.css">
<!--MM-HEAD--><link rel="stylesheet" href="/assets/css/chosen.min.css"><link rel="stylesheet" href="/assets/css/bootstrap-datepicker3.min.css">    <link rel="stylesheet" href="/assets/css/chosen.min.css" />
    <link rel="stylesheet" href="/assets/css/bootstrap-datepicker3.min.css" />

<!--/MM-HEAD--><link rel="stylesheet" href="/assets/custom_css/style.css"><link rel="stylesheet" href="/assets/custom_css/ui.css"><link rel="stylesheet" href="/assets/custom_css/shell.css"></head><body class="no-skin mm-shell"><div class="mm-shell-main" style="padding:16px"><!--MM-BODY-->        <section class="mm-ui mm-banquet mm-room-form">
    <div class="tw-space-y-4 tw-py-2">
        <header class="mm-page-head tw-flex tw-flex-wrap tw-items-center tw-justify-between tw-gap-x-4 tw-gap-y-2">
            <div class="mm-page-title">
                <h1 class="tw-m-0 tw-font-semibold tw-text-ink">Add a hall</h1>
                <p class="tw-m-0 tw-text-sm tw-text-muted">Configure hall details, availability status and capacity.</p>            </div>
                    </header>
        <div class="mm-panel tw-p-4 sm:tw-p-6 render-class"><form class="form-horizontal roomCreateForm" id="companyForm"
                action="http://localhost/bq/banquet/hall-rooms/store" method="post"
                enctype="multipart/form-data">
                <input type="hidden" name="_token" value="fixture-csrf-token">                
                <div class="row">
                    <div class="col-sm-12">
                        <div class="form-group">
                            <label class="col-sm-3 control-label" for="form-field-1-1"> Hall Name <span
                                    style="color: deeppink">*</span> </label>
                            <div class="col-xs-12 col-sm-8 ">
                                <input type="text" class="form-control input-sm" name="name"
                                    value="" placeholder="Enter Hall Name">

                                                            </div>
                        </div>
                    </div>
                    <div class="col-sm-12">
                        <div class="form-group">
                            <label class="col-sm-3 control-label" for="form-field-1-1"> Category Name <span
                                    style="color: deeppink">*</span> </label>

                            <div class="col-xs-12 col-sm-8 ">
                                <select name="hall_category" id="category" class="form-control chosen-select" required><option value="">Select Category Name</option><option value="1">Wedding &lt;i&gt;hall&lt;/i&gt;</option></select>

                                                            </div>
                        </div>
                    </div>

                    <div class="col-sm-12">
                        <div class="form-group">
                            <label class="col-sm-3 control-label" for="form-field-1-1"> Hall Number <span
                                    style="color: deeppink">*</span></label>
                            <div class="col-xs-12 col-sm-8 ">
                                <input type="text" class="form-control input-sm" name="hall_number"
                                    id="roomNumber" value=""
                                    placeholder="Enter Hall Number" required
                                    onkeyup="checkRoomNumber(this)">
                                <p id="duplicateRoomError" style="color: red; display: none;"></p>
                                                            </div>
                        </div>
                    </div>


                    <div class="col-sm-12">
                        <div class="form-group">
                            <label class="col-sm-3 control-label" for="form-field-1-1"> Size SQ </label>
                            <div class="col-xs-12 col-sm-8 ">
                                <input type="text" class="form-control input-sm" name="hall_sqft"
                                    value="" placeholder="Enter Square Size">

                                                            </div>
                        </div>
                    </div>
                    
                    <div class="col-sm-12">
                        <div class="form-group">
                            <label class="col-sm-3 control-label" for="form-field-1-1"> Rent
                            </label>
                            <div class="col-xs-12 col-sm-8 ">
                                <input type="text" class="form-control input-sm" name="price"
                                    value="" placeholder="Rent">

                                                            </div>
                        </div>
                    </div>


                    
                    <div class="col-sm-12">
                        <div class="form-group">
                            <label class="col-sm-3 control-label" for="form-field-1-1"> Max Guests
                            </label>
                            <div class="col-xs-12 col-sm-8 ">
                                <input type="text" class="form-control input-sm" name="max_guests"
                                    value="" placeholder="Enter Max Guests">

                                                            </div>
                        </div>
                    </div>

                    <div class="col-sm-12">
                        <div class="form-group">
                            <label class="col-sm-3 control-label" for="form-field-1-1">Status</label>
                            <div class="col-xs-12 col-sm-8 ">
                                <select name="status" class="form-control chosen-select" required>
                                    <option></option>
                                    <option value="1" selected>Ready</option>
                                    <option value="0">Dirty</option>
                                    <option value="2">Maintenance</option>
                                </select>
                                                            </div>
                        </div>
                    </div>


                    



                    <div class="col-sm-12" style="display: none">
                        <div class="form-group">
                            <label class="col-sm-3 control-label" for="form-field-1-1">Date :</label>
                            <div class="col-xs-12 col-sm-8 ">
                                <div class="input-group">
                                    <div class="input-group-addon"><span class="fa fa-calendar"></span>
                                    </div>
                                    <div class="input-group">
                                        <input type="text" class="form-control input-sm date-picker"
                                            name="from_date"
                                            value="2026-10-01"
                                            autocomplete="off">
                                        <span class="input-group-addon">From|To</span>
                                        <input type="text" class="form-control input-sm date-picker"
                                            name="to_date"
                                            value="2026-10-01"
                                            autocomplete="off">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>


                </div>


                <div class="form-actions center" style="text-align: right !important;">
                    <button type="submit" class="mm-button" id="submitRoomFormBtn"
                        onclick="submitRoomStoreForm(this)">
                        <i class="ace-icon fa fa-save icon-on-right bigger-110"></i>
                        Save
                    </button>
                </div>
            </form></div>
    </div>
</section>
<!--/MM-BODY--></div>
<script src="/assets/js/jquery-2.1.4.min.js"></script><script src="/assets/js/bootstrap.min.js"></script><script src="/assets/js/ace-elements.min.js"></script><script src="/assets/js/ace.min.js"></script>
<!--MM-JS--><script src="/assets/js/chosen.jquery.min.js"></script><script src="/assets/js/bootstrap-datepicker.min.js"></script><script src="/assets/js/bootstrap-timepicker.min.js"></script><script src="/assets/custom_js/date-picker.js"></script>
<script>window.warnings = []; function warning(kind, message) { window.warnings.push(message); } jQuery.LoadingOverlay = function (action) { window.overlay = (window.overlay || []).concat(action); };</script>

    <script src="/assets/js/jquery.dataTables.min.js"></script>
    <script src="/assets/js/jquery.dataTables.bootstrap.min.js"></script>
    <script src="/assets/custom_js/date-picker.js"></script>


    


    <!-- inline scripts related to this page -->
    <script type="text/javascript">
        function delete_check(id) {
            Swal.fire({
                title: 'Are you sure ?',
                html: "<b>You want to delete permanently !</b>",
                type: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#3085d6',
                cancelButtonColor: '#d33',
                confirmButtonText: 'Yes, delete it!',
                width: 400,
            }).then((result) => {
                if (result.value) {
                    $('#deleteCheck_' + id).submit();
                }
            })

        }
    </script>
<!--/MM-JS--></body></html>
