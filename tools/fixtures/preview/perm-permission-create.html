<!--/MM-HEAD--><link rel="stylesheet" href="/assets/custom_css/style.css"><link rel="stylesheet" href="/assets/custom_css/ui.css"><link rel="stylesheet" href="/assets/custom_css/shell.css"></head><body class="no-skin mm-shell"><div class="mm-shell-main" style="padding:16px"><!--MM-BODY-->
    <section class="mm-ui mm-hotel-setup mm-perm mm-perm-narrow">
    <div class="tw-space-y-4 tw-py-2">
        <header class="mm-page-head tw-flex tw-flex-wrap tw-items-center tw-justify-between tw-gap-x-4 tw-gap-y-2">
            <div class="mm-page-title">
                <h1 class="tw-m-0 tw-font-semibold tw-text-ink">Create permission</h1>
                <p class="tw-m-0 tw-text-sm tw-text-muted">Add a permission under a parent permission, with the actions it supports.</p>            </div>
            <div class="tw-flex tw-flex-wrap tw-gap-2 mm-no-print"><a class="mm-button mm-button-secondary" href="http://localhost/setting/permissions"> <i class="fa fa-list-alt"></i> Permission List </a></div>        </header>
        <div class="mm-panel tw-p-4 sm:tw-p-6"><form class="form-horizontal" action="http://localhost/setting/permissions" method="post" enctype="multipart/form-data">
                        <input type="hidden" name="_token" value="fixture-csrf-token">
                            


                            <div class="form-group">
                                <label class="col-sm-3 control-label" for="form-field-1-1"> Parent Permission  </label>
                                <div class="col-xs-12 col-sm-8 ">
                                    <select class="chosen-select form-control" name="parent_permission_id">
                                        <option value=""> select </option>
                                                                                    <option value="7" >Room list</option>
                                                                            </select>
                                                                    </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-3 control-label" for="form-field-1-1"> Permission Name </label>
                                <div class="col-xs-12 col-sm-8 ">
                                    <input type="text" class="form-control" name="name"
                                           value="" placeholder="Permission Name">

                                                                    </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-3 control-label" for="form-field-1-1"> Description </label>
                                <div class="col-xs-12 col-sm-8 ">
                                    <input type="text" class="form-control" name="description"
                                           value="" placeholder="Description (optional)">

                                                                    </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-3 control-label" for="form-field-1-1"> With </label>
                                <div class="col-xs-12 col-sm-8">
                                     <label>
                                        <input type="checkbox" name="actions[]" checked value="View" class="ace">
                                        <span class="lbl"> View </span>
                                    </label>
                                    <label>
                                        <input type="checkbox" name="actions[]" checked value="Create" class="ace">
                                        <span class="lbl"> Create </span>
                                    </label>
                                    <label>
                                        <input type="checkbox" name="actions[]" checked value="Edit" class="ace">
                                        <span class="lbl"> Edit </span>
                                    </label>
                                    
                                    <label>
                                        <input type="checkbox" name="actions[]" checked value="Delete" class="ace">
                                        <span class="lbl"> Delete </span>
                                    </label>
                                    <label>
                                        <input type="checkbox" name="actions[]" checked value="Approve" class="ace">
                                        <span class="lbl"> Approve </span>
                                    </label>
                                    <label>
                                        <input type="checkbox" name="actions[]" checked value="Super Approve" class="ace">
                                        <span class="lbl"> Super Approve </span>
                                    </label>
                                </div>
                               
                            </div>




                            <div class="form-group">
                                <label for="inputError" class="col-xs-12 col-sm-3 col-md-3 control-label"></label>
                                <div class="col-xs-12 col-sm-6">
                                    <button class="btn btn-success"> <i class="fa fa-save"></i> Save </button>
                                    <a href="http://localhost/setting/permissions" class="btn btn-info"> <i class="fa fa-list"></i> List </a>
                                </div>
                            </div>

                        </form></div>
    </div>
</section>
