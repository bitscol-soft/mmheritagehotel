<style>
    .tags{width: 100% !important;}
</style>
<!--/MM-HEAD--><link rel="stylesheet" href="/assets/custom_css/style.css"><link rel="stylesheet" href="/assets/custom_css/ui.css"><link rel="stylesheet" href="/assets/custom_css/shell.css"></head><body class="no-skin mm-shell"><div class="mm-shell-main" style="padding:16px"><!--MM-BODY--><section class="mm-ui mm-web mm-room-form">
    <div class="tw-space-y-4 tw-py-2">
        <header class="mm-page-head tw-flex tw-flex-wrap tw-items-center tw-justify-between tw-gap-x-4 tw-gap-y-2">
            <div class="mm-page-title">
                <h1 class="tw-m-0 tw-font-semibold tw-text-ink">Add a service box</h1>
                <p class="tw-m-0 tw-text-sm tw-text-muted">Add a box to the Our Services section.</p>            </div>
                    </header>
        <div class="mm-panel tw-p-4 sm:tw-p-6 tw-p-5 mm-web-narrow"><form class="form-horizontal" id="companyForm" action="http://localhost/hw/website-core/our_service_list/store" method="post" enctype="multipart/form-data">
            <input type="hidden" name="_token" value="fixture-csrf-token">            
            <div class="row">
                <div class="col-sm-12">
                    <div class="form-group">
                        <label class="col-sm-3 control-label" for="form-field-1-1">Service Title</label>

                        <div class="col-xs-12 col-sm-8 ">
                            <input type="text" class="form-control input-sm" name="service_title" value="" placeholder="Enter Service Title">

                                                    </div>
                    </div>
                </div>
                <div class="col-sm-12">
                    <div class="form-group">
                        <label class="col-sm-3 control-label">Service Short Desc</label>
                        <div class="col-xs-12 col-sm-8 ">
                            <textarea name="service_short_desc" rows="5" class="form-control" placeholder="Enter Description"></textarea>

                                                    </div>
                    </div>
                </div>
                <div class="col-sm-12">
                    <div class="form-group">
                        <label class="col-sm-3 control-label" for="form-field-1-1">Service Box Icon (FontAwsome 4.7)</label>

                        <div class="col-xs-12 col-sm-8 ">
                            <input type="text" class="form-control input-sm" name="service_icon" value="" placeholder="Ex - fa fa-bed">

                                                    </div>
                    </div>
                </div>
                <div class="col-sm-12">
                    <div class="form-group">
                        <label class="col-sm-3 control-label" for="form-field-1-1">Service List</label>


                        <div class="col-xs-12 col-sm-8 ">
                            <div class="inline" style="display: inline !important;">
												<input type="text" class="form-control" name="service_list" id="form-field-tags" value="" placeholder="Enter tags ..." />
											</div>
                        </div>
                    </div>
                </div>

            </div>


            <div class="form-actions center" style="text-align: right !important; margin: 0;">
                <button type="submit" class="mm-button">
                    <i class="ace-icon fa fa-save icon-on-right bigger-110"></i>
                    Save
                </button>
            </div>
        </form></div>
    </div>
</section>
<!--/MM-BODY--></div>
<script src="/assets/js/jquery-2.1.4.min.js"></script><script src="/assets/js/bootstrap.min.js"></script><script src="/assets/js/ace-elements.min.js"></script><script src="/assets/js/ace.min.js"></script>

<script src="/assets/js/jquery.dataTables.min.js"></script>
<script src="/assets/js/jquery.dataTables.bootstrap.min.js"></script>
<script src="/assets/js/bootstrap-tag.min.js"></script>
<script>
    var tag_input = $('#form-field-tags');
    try{
        tag_input.tag({
                placeholder:tag_input.attr('placeholder'),
            });

    }
    catch(e) {
        tag_input.after('<textarea id="'+tag_input.attr('id')+'" name="'+tag_input.attr('name')+'" rows="3">'+tag_input.val()+'</textarea>').remove();
    }
</script>
