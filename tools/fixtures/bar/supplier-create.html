<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Checkout fixture</title>
<link rel="stylesheet" href="/assets/css/bootstrap.min.css"><link rel="stylesheet" href="/assets/css/ace.min.css"><link rel="stylesheet" href="/assets/font-awesome/4.5.0/css/font-awesome.min.css">
<!--MM-HEAD--><link rel="stylesheet" href="/assets/css/chosen.min.css"><link rel="stylesheet" href="/assets/css/bootstrap-datepicker3.min.css"><!--/MM-HEAD--><link rel="stylesheet" href="/assets/custom_css/style.css"><link rel="stylesheet" href="/assets/custom_css/ui.css"><link rel="stylesheet" href="/assets/custom_css/shell.css"></head><body class="no-skin mm-shell"><div class="mm-shell-main" style="padding:16px"><!--MM-BODY-->
<section class="mm-ui mm-hotel-setup mm-bar mm-rst mm-rst-inv">
    <div class="tw-space-y-4 tw-py-2">
        <header class="mm-page-head tw-flex tw-flex-wrap tw-items-center tw-justify-between tw-gap-x-4 tw-gap-y-2">
            <div class="mm-page-title">
                <h1 class="tw-m-0 tw-font-semibold tw-text-ink">Add Supplier</h1>
                <p class="tw-m-0 tw-text-sm tw-text-muted">Register a supplier for bar purchases.</p>            </div>
            <div class="tw-flex tw-flex-wrap tw-gap-2 mm-no-print"><a class="mm-button mm-button-secondary" href="http://localhost/x/bar/suppliers/index">
            <i class="fa fa-list"></i> Supplier List
        </a></div>        </header>
        <div class="mm-panel tw-p-4 sm:tw-p-6 tw-p-5"><form class="form-horizontal" id="supplier-form" action="http://localhost/x/bar/suppliers/store" method="post">
            <input type="hidden" name="_token" value="fixture-csrf-token">
            <div class="row">
                <div class="col-sm-12">

                    <div class="form-group">
                        <label for="supplier-name" class="col-sm-3 control-label">Supplier Name <sup class="text-danger">*</sup></label>
                        <div class="col-xs-12 col-sm-8">
                            <input type="text" name="name" id="supplier-name" value="" class="form-control"
                                placeholder="Enter supplier name" autocomplete="off" required>
                                                    </div>
                    </div>

                    <div class="form-group">
                        <label for="supplier-phone" class="col-sm-3 control-label">Phone</label>
                        <div class="col-xs-12 col-sm-8">
                            <input type="number" name="phone" id="supplier-phone" value="" class="form-control"
                                placeholder="Phone" autocomplete="off">
                                                    </div>
                    </div>

                    <div class="form-group">
                        <label for="supplier-email" class="col-sm-3 control-label">Email</label>
                        <div class="col-xs-12 col-sm-8">
                            <input type="email" name="email" id="supplier-email" value="" class="form-control"
                                placeholder="Email" autocomplete="off">
                                                    </div>
                    </div>

                    <div class="form-group">
                        <label for="supplier-address" class="col-sm-3 control-label">Address</label>
                        <div class="col-xs-12 col-sm-8">
                            <textarea name="address" id="supplier-address" class="form-control" rows="3" placeholder="Address"></textarea>
                                                    </div>
                    </div>

                </div>
            </div>

            <div class="form-actions center" style="text-align: right !important;">
                <button type="submit" class="btn-sm btn-outline-success">
                    <i class="fa fa-save"></i> Save
                </button>

                <a href="http://localhost/x/bar/suppliers/index" class="btn-sm btn btn-default">
                    <i class="fa fa-backward"></i> Back List
                </a>
            </div>
        </form></div>
    </div>
</section>

<!--/MM-BODY--></div>
<script src="/assets/js/jquery-2.1.4.min.js"></script><script src="/assets/js/bootstrap.min.js"></script><script src="/assets/js/ace-elements.min.js"></script><script src="/assets/js/ace.min.js"></script>
