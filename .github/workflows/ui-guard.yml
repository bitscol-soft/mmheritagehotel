# =============================================================================
# UI guard — diff tripwires for Blade / JS / CSS UI changes (W0.4).
#
# Runs tools/ui-guard.sh on every push and PR. Three tripwires (per
# docs/FRONTEND-DEV-PLAN.md W0.4):
#   1. money-line change: any added/removed line in resources/views/**/*.blade.php
#      or module/*/views/**/*.blade.php that touches invoice/payment context plus
#      an amount keyword. Override with <!-- money-travel-on: <reason> -->.
#   2. nested style include: any @include/@yield/@stack directive inside a
#      <style>…</style> block in a Blade file (round-10 defect class).
#   3. page-header + x-page combo: file with BOTH <x-mm.page> AND
#      @section('page-header') is a W2.3 violation (the master layout
#      does not @yield it, so the page-header block is dead code).
#
# The script exits 1 when any tripwire triggers, which fails this workflow.
# A second job runs tools/ui-guard-test.sh as a self-test that catches
# silent regressions in the tripwire regexes themselves (9 assertions
# cover all three tripwires + the per-line override marker + the
# portable character-class word boundary).
# =============================================================================
name: UI guard

on:
  push:
    branches:
      - 'arena/**'
    paths:
      - 'resources/views/**/*.blade.php'
      - 'module/**/views/**/*.blade.php'
      - 'tools/ui-guard.sh'
      - 'tools/ui-guard-test.sh'
      - '.github/workflows/ui-guard.yml'
  pull_request:
    paths:
      - 'resources/views/**/*.blade.php'
      - 'module/**/views/**/*.blade.php'
      - 'tools/ui-guard.sh'
      - 'tools/ui-guard-test.sh'
      - '.github/workflows/ui-guard.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  guard:
    name: Diff tripwires (money-line, nested-style)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up the merge base
        id: base
        run: |
            # Default to origin/main for push events on a branch ref, and to
            # the PR base for pull_request events. The script takes --base=<ref>
            # and computes the diff against HEAD on that branch.
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "ref=${{ github.event.pull_request.base.ref }}" >> "$GITHUB_OUTPUT"
            else
              echo "ref=${{ github.event.repository.default_branch }}" >> "$GITHUB_OUTPUT"
            fi
            echo "Branch HEAD: $(git rev-parse --short HEAD)"
            echo "Base ref:    ${{ steps.base.outputs.ref }}"

      - name: Fetch the base branch
        run: git fetch origin "${{ steps.base.outputs.ref }}"

      - name: Run the diff tripwires
        id: tripwires
        run: ./tools/ui-guard.sh --base="origin/${{ steps.base.outputs.ref }}" 2> tripwire-failures.txt || echo "TRIPWIRE_FAILED=1" >> "$GITHUB_OUTPUT"

      - name: Post PR comment on tripwire failure
        if: failure() && steps.tripwires.outputs.TRIPWIRE_FAILED == '1' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
              const fs = require('fs');
              const body = fs.readFileSync('tripwire-failures.txt', 'utf8') ||
                'tools/ui-guard.sh exited non-zero but produced no stderr.';
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '## :no_entry: UI guard — tripwire fired\n\n' +
                  '`tools/ui-guard.sh` rejected this PR. The full stderr is below.\n\n' +
                  '```\n' + body + '\n```\n\n' +
                  'See `docs/FRONTEND-DEV-PLAN.md` §0 (guardrails) for the rule and the override syntax ' +
                  '(`<!-- money-travel-on: <reason> -->` on the affected line, or ' +
                  '`{{-- money-travel-on-block: <reason> --}} ... {{-- money-travel-on-end --}}` for a block).'
              });

  guard-self-test:
    name: Tripwire self-test (smoke test the guard)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run the tripwire self-test
        # tools/ui-guard-test.sh builds a throwaway git repo per assertion
        # and feeds synthetic violations to tools/ui-guard.sh, asserting
        # that each tripwire still fires and that benign changes still
        # pass. The test caught a real mawk-vs-gawk portability bug in
        # the money-line tripwire (the GNU `\<...\>` word-boundary syntax
        # is a no-op on mawk, the default awk on Debian-based systems
        # including the GitHub Actions ubuntu-latest runner).
        id: selftest
        run: ./tools/ui-guard-test.sh 2> selftest-failures.txt || echo "SELFTEST_FAILED=1" >> "$GITHUB_OUTPUT"

      - name: Post PR comment on self-test failure
        if: failure() && steps.selftest.outputs.SELFTEST_FAILED == '1' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
              const fs = require('fs');
              const body = fs.readFileSync('selftest-failures.txt', 'utf8') ||
                'tools/ui-guard-test.sh exited non-zero but produced no stderr.';
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '## :warning: UI guard — self-test FAILED\n\n' +
                  '`tools/ui-guard-test.sh` rejected this PR because at least one tripwire in `tools/ui-guard.sh` is no longer ' +
                  'firing on a synthetic violation (or a benign change was incorrectly flagged).\n\n' +
                  'The most likely cause is a refactor that broke one of the tripwire regexes. The ' +
                  'test catches:\n' +
                  '  - money-line changes that no longer trip (e.g. word-boundary regression)\n' +
                  '  - benign changes that now incorrectly trip (false positive)\n' +
                  '  - nested-style includes that no longer trip\n' +
                  '  - page-header + x-page combos that no longer trip\n\n' +
                  'Fix the tripwire regex in `tools/ui-guard.sh` and re-run the workflow.\n\n' +
                  'Full stderr:\n\n```\n' + body + '\n```'
              });