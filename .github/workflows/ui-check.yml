name: Tailwind UI checks
on: [push, pull_request]
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, pdo, pdo_mysql, pdo_sqlite, bcmath, gd, intl, zip
          coverage: none
      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-
      - name: Install composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --ignore-platform-reqs
      - name: Laravel 11 readiness guard
        run: bash tools/laravel11-check.sh
      - name: PHP test suite (phpunit)
        run: |
          if ! vendor/bin/phpunit > /tmp/phpunit.log 2>&1; then
            cat /tmp/phpunit.log
            # surface the failing assertion (and the crawl findings it may list) in the
            # check annotation - the job log itself is not always reachable
            echo "::error::$(grep -E 'Unexpected crawl failures|^[0-9]+\) |Failed asserting' /tmp/phpunit.log | head -n 20 | tr '\n' ' ')"
            exit 1
          fi
          cat /tmp/phpunit.log
          grep -E '^crawl \|' /tmp/phpunit.log || true
          # the two summary lines, as a check annotation: readable without the job log
          echo "::notice::$(grep -E '^crawl \| (GET routes crawled|buckets)' /tmp/phpunit.log | tr '\n' ' ')"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run ui:build
      - run: git diff --exit-code -- public/assets/custom_css/ui.css public/assets/custom_css/shell.css
      - run: npm run ui:check
      - run: |
          if ! php tools/ui-blade-check.php > /tmp/blade-check.log 2>&1; then
            cat /tmp/blade-check.log
            echo "::error::$(tail -n 12 /tmp/blade-check.log | tr '\n' ' ')"
            exit 1
          fi
          cat /tmp/blade-check.log
      - run: npx playwright install --with-deps chromium
      - run: |
          if ! npm run ui:browser > /tmp/browser-check.log 2>&1; then
            cat /tmp/browser-check.log
            echo "::error::$(tail -n 20 /tmp/browser-check.log | tr '\n' ' ')"
            exit 1
          fi
          cat /tmp/browser-check.log
