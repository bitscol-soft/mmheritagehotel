name: Tailwind UI checks
on: [push, pull_request]
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run ui:build
      - run: git diff --exit-code -- public/assets/custom_css/ui.css public/assets/custom_css/shell.css
      - run: npm run ui:check
      - run: php tools/ui-blade-check.php
      - run: npx playwright install --with-deps chromium
      - run: npm run ui:browser
