name: Tailwind UI checks
on: [push, pull_request]
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, pdo, pdo_mysql, pdo_sqlite, bcmath, gd, intl, zip
          coverage: none
      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-
      - name: Install composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --ignore-platform-reqs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run ui:build
      - run: git diff --exit-code -- public/assets/custom_css/ui.css public/assets/custom_css/shell.css
      - run: npm run ui:check
      - run: php tools/ui-blade-check.php
      - run: npx playwright install --with-deps chromium
      - run: npm run ui:browser
